  - id: d04
    question: "What's the on_time_ship_rate for account ACC0136?"
    expected_metrics: [on_time_ship_rate]
    expected_links: []
    key_facts: ["on_time_ship_rate", "ACC0136"]

  # Moved from the old degraded_path category (see the correction note above)
  # — this is an ordinary successful query with no exclusion involved.
  - id: d05
    question: "What's the veneer_yield for lot LOT-MAP-011?"
    expected_metrics: [veneer_yield]
    expected_links: []
    key_facts: ["veneer_yield", "LOT-MAP-011"]

out_of_scope:
  - id: o01
    question: "What's our customer churn rate this quarter?"
  - id: o02
    question: "How does our marketing spend correlate with order volume?"
  - id: o03
    question: "What's the average employee tenure at our press line facilities?"
  - id: o04
    question: "How do our prices compare to competitor skateboard brands?"
  - id: o05
    question: "What's our carbon footprint per skateboard produced?"
  - id: o06
    question: "What's the average response time on customer support tickets?"

# Ambiguous questions name two declared metrics by name and ask which one is
# "the bigger problem right now" with no stated benchmark — confirmed live
# against the real guard (not just the fake-client unit tests) to reliably
# return in_scope=true + ambiguous=true, unlike two earlier drafts that
# didn't: "What's our yield?" (bare metric-name ambiguity) and "How's that
# press line doing?" (unnamed-entity ambiguity) both got in_scope=false
# instead — the guard collapsed "I can't pick a default" into "unanswerable"
# rather than "answerable, but ambiguous," for both an unnamed metric and an
# unnamed entity. Comparative phrasing that explicitly names both candidate
# metrics avoids that: the guard can see both are answerable and only the
# "bigger problem" judgment itself is undefined. Even this is narrower than
# it looks — "the more urgent thing to fix" (business-priority framing) and
# vaguer paraphrases of a metric name ("supplier quality", "press line
# performance") both still fell back to in_scope=false in testing; only the
# literal metric name plus "bigger problem" wording confirmed reliably.
ambiguous:
  - id: m01
    question: "Which yield are we underperforming on?"
  - id: m02
    question: "Is the veneer yield or the first-pass yield the bigger problem right now?"
  - id: m03
    question: "Is our scrap_cost_per_batch or our first_pass_yield the bigger quality problem right now?"
  - id: m04
    question: "Is our on_time_ship_rate or our delamination_claim_rate the bigger problem right now?"

# Held-out-results questions ask about a batch that carries an approved
# quarantine action, so the ontology's own filtering excludes it from the
# metric's normal result set. The tool call succeeds — this is a valid,
# deliberately-empty-for-this-batch result, not an error. The pass condition
# is that the agent explains the exclusion honestly (names the quarantine,
# doesn't report a misleading zero or fabricate a number) rather than that
# any tool call raised.
held_out_results:
  - id: d01
    question: "What's the first_pass_yield for batch B0050?"
    metric: first_pass_yield
  - id: d02
    question: "What's the delamination_claim_rate for batch B0203?"
    metric: delamination_claim_rate
  - id: d03
    question: "What's the scrap_cost_per_batch for batch B0233?"
    metric: scrap_cost_per_batch
