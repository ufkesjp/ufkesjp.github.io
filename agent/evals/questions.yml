# Golden questions for the Eval Boards agent — Run 3 eval harness.
#
# Four categories, 30 questions total:
#   answerable       (17) — expected_metrics/expected_links name the tool(s)
#                           the agent's trace must show it used; key_facts are
#                           substrings the final answer must contain.
#   out_of_scope     (6)  — the coverage guard must refuse (guard_decision.in_scope
#                           == false) before any tool call runs.
#   ambiguous        (4)  — the coverage guard must ask rather than assume
#                           (guard_decision.ambiguous == true), because no
#                           single default reading is clearly correct.
#   held_out_results (3)  — the question asks about a batch that is held out
#                           of metric results by an approved quarantine
#                           action. The underlying tool call succeeds — this
#                           is not an error path — and the pass condition is
#                           that the agent explains the exclusion honestly
#                           instead of reporting a misleading empty or zero
#                           value.
#
# Correction (2026-08-30): this category was previously named `degraded_path`
# and scored as if the quarantine exclusion were a genuine tool error
# (`triggered_genuine_error`). It never was — d01-d03 below always returned a
# successful, held-out result, and the two other original members of that set
# (ordinary successful queries with no exclusion involved) have been moved
# into `answerable` below, where they belong. See PHASE_4.md for the full
# writeup. A category that tests actual tool-call error recovery does not
# exist yet.
#
# `smoke` lists 5 question ids (one per category, plus one extra
# held_out_results) to run first with `--subset smoke`. Only run the full 30
# once smoke is green — per EVAL_BOARDS_KICKOFF.md this flag is most of the
# weekend's API budget.

smoke:
  - a01
  - o01
  - m01
  - d01
  - d02

answerable:
  - id: a01
    question: "What's the first_pass_yield for press line PL02, by month?"
    expected_metrics: [first_pass_yield]
    expected_links: []
    key_facts: ["first_pass_yield", "PL02"]

  - id: a02
    question: "What's the scrap_cost_per_batch for the Cruiser series?"
    expected_metrics: [scrap_cost_per_batch]
    expected_links: []
    key_facts: ["scrap_cost_per_batch", "Cruiser"]

  - id: a03
    question: "What's the veneer_yield across SUP01's maple veneer lots?"
    expected_metrics: [veneer_yield]
    expected_links: []
    key_facts: ["veneer_yield", "SUP01"]

  - id: a04
    question: "What's our on-time ship rate for flagship-tier accounts?"
    expected_metrics: [on_time_ship_rate]
    expected_links: []
    key_facts: ["on_time_ship_rate", "flagship"]

  - id: a05
    question: "What's the delamination_claim_rate for the Pro series?"
    expected_metrics: [delamination_claim_rate]
    expected_links: []
    key_facts: ["delamination_claim_rate", "Pro"]

  - id: a06
    question: "Compare first_pass_yield between Q1 2026 (Jan-Mar) and Q2 2026 (Apr-Jun)."
    expected_metrics: [first_pass_yield]
    expected_links: []
    key_facts: ["first_pass_yield"]

  - id: a07
    question: "Which supplier does material lot LOT-MAP-011 come from, and what's their quality tier?"
    expected_metrics: []
    expected_links: [supplied_by]
    key_facts: ["SUP01"]

  - id: a08
    question: "Which press line did production batch B0050 run on?"
    expected_metrics: []
    expected_links: [ran_on]
    key_facts: ["PL01"]

  - id: a09
    question: "Which retail account placed order ORD00005, and what region are they in?"
    expected_metrics: []
    expected_links: [placed_by]
    key_facts: ["ACC0136", "Northeast"]

  - id: a10
    question: "What production batch fulfilled order ORD00005?"
    expected_metrics: []
    expected_links: [fulfilled_from]
    key_facts: ["B0095"]

  - id: a11
    question: "What material lots did production batch B0203 consume?"
    expected_metrics: []
    expected_links: [consumes]
    key_facts: ["LOT-MAP-011"]

  - id: a12
    question: "What deck does warranty claim WC00001 concern, and what batch was it produced from?"
    expected_metrics: []
    # Only `concerns` is required: traverse_link("concerns", ...) returns the
    # full Deck row, and batch_id is a property on that row — a well-reasoned
    # agent reads it from there rather than making a second, redundant
    # produced_by hop for information it already has.
    expected_links: [concerns]
    key_facts: ["D000002", "B0240"]

  - id: a13
    question: "What batch was quality inspection QI0001 performed on, and what press line did that batch run on?"
    expected_metrics: []
    expected_links: [inspected_by, ran_on]
    key_facts: ["B0240"]

  - id: a14
    question: "What batch was deck D000001 produced from?"
    expected_metrics: []
    expected_links: [produced_by]
    key_facts: ["B0240"]

  - id: a15
    question: >-
      Order ORD00005 is stuck behind a capacity-constrained batch B0095 —
      reroute it to batch B0070 instead (same series, not quarantined) and
      file the action.
    expected_metrics: []
    expected_links: []
    expected_tools: [propose_action]
    key_facts: ["ORD00005", "pending_approval"]

  # Moved from the old degraded_path category (see the correction note above)
